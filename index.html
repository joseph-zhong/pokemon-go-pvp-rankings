<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon GO PvP Tools</title>
    <meta name="description" content="Instant, ad-free Pokemon GO PvP tools. No loading, no ads." />
    <link rel="stylesheet" href="/src/shared/base.css" />
    <style>
      .tool-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .tool-link {
        display: block;
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 10px;
        text-decoration: none;
        color: var(--ink);
      }
      .tool-link:hover {
        border-color: var(--accent);
      }
      .tool-link strong {
        display: block;
        font-size: 16px;
        margin-bottom: 3px;
      }
      .tool-link span {
        font-size: 14px;
        color: var(--ink-soft);
      }
      .tool-link[aria-disabled="true"] {
        opacity: 0.55;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="page-head">
        <h1>Pokemon GO PvP Tools</h1>
        <p class="page-sub">Instant, ad-free. No loading, no ads.</p>
      </header>

      <div class="card tool-list">
        <a class="tool-link" href="/ranks/">
          <strong>IV Rank Checker</strong>
          <span>Pick a Pokemon, enter its IVs, get its rank instantly.</span>
        </a>
        <a class="tool-link" href="/pvp/">
          <strong>Team Builder</strong>
          <span>Suggested teams for Great/Ultra/Master League and current meta cups.</span>
        </a>
      </div>

      <footer class="page-foot">
        Data: <a href="https://github.com/pvpoke/pvpoke">pvpoke/pvpoke</a> (MIT). Not affiliated with Niantic.
        <a href="https://github.com/joseph-zhong/pokemon-go-pvp-rankings">Source</a>
      </footer>
    </main>
  </body>
</html>
